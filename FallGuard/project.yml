name: FallGuard
options:
  bundleIdPrefix: com.watchfall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: 1
targets:
  FallGuard:
    type: application
    platform: iOS
    sources:
      - path: FallGuard
    resources:
      - path: FallGuard/Assets.xcassets
      - path: FallGuard/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchfall.FallGuard
        INFOPLIST_FILE: FallGuard/Info.plist
        GENERATE_INFOPLIST_FILE: false
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAILogic
      - package: firebase-ios-sdk
        product: FirebaseMessaging
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseAppCheck
    info:
      path: FallGuard/Info.plist
      properties:
        UILaunchScreen: {}
